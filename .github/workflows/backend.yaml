name: Backend CI 

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:   # optional (manual trigger)

jobs:
  build:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check db.js
          node --check routes/tasks.js
          node --check models/task.js

      - name: Start server and wait for health
        shell: bash
        run: |
          # install & build (if needed)
          npm ci
          # start server in background and save logs
          npm start &> server.log & echo $! > server.pid

          # wait for the HTTP health endpoint (30s timeout)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/tasks/ping; then
              echo "Server is healthy"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done

          # final check and fail with logs if still down
          if ! curl -fsS http://localhost:8080/api/tasks/ping; then
            echo "Server did not become healthy, dumping server.log:"
            tail -n 200 server.log
            exit 1
          fi

          