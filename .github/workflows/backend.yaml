name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: server

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check db.js
          node --check routes/tasks.js
          node --check models/task.js


      - name: Start MongoDB
        run: |
          docker rm -f mongodb 2>/dev/null || true

          docker run -d \
            --name mongodb \
            -p 27017:27017 \
            marwaahmed11/mongodb:v1

      - name: Wait for MongoDB
        working-directory: .
        run: |
          echo "Waiting for MongoDB..."

          for i in $(seq 1 30); do
            if docker exec mongodb \
              mongosh --quiet \
              --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; then
              echo "MongoDB is ready"
              exit 0
            fi

            echo "Waiting for MongoDB... ($i/30)"
            sleep 1
          done

          echo "MongoDB failed to start"
          docker logs mongodb
          exit 1

      # ==========================================
      # BACKEND
      # ==========================================
      - name: Start server and wait for health
        shell: bash
        run: |
          echo "Starting backend..."

          npm start > server.log 2>&1 &
          echo $! > server.pid

          echo "Waiting for backend..."

          for i in $(seq 1 30); do
            if curl --fail --silent \
              http://localhost:8080/api/tasks/ping; then

              echo
              echo "Server is healthy"
              exit 0
            fi

            echo "Waiting for server... ($i/30)"
            sleep 1
          done

          echo "Server did not become healthy"
          echo "================================"
          echo "Backend logs:"
          echo "================================"
          cat server.log
          exit 1
