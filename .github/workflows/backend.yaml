name: Backend CI 

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # optional (manual trigger)

jobs:
  build:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint || true

      - name: Run tests
        run: npm test 