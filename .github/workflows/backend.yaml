name: Todo App CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================
  # BACKEND
  # ==========================================

  backend:
    name: Backend CI
    runs-on: self-hosted

    defaults:
      run:
        working-directory: server

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check db.js
          node --check routes/tasks.js
          node --check models/task.js

      # ==========================================
      # MONGODB
      # ==========================================

      - name: Start MongoDB
        working-directory: .
        run: |
          docker rm -f mongodb 2>/dev/null || true

          docker run -d \
            --name mongodb \
            -p 27017:27017 \
            marwaahmed11/mongodb:v1

      - name: Wait for MongoDB
        working-directory: .
        run: |
          echo "Waiting for MongoDB..."

          for i in $(seq 1 30); do
            if docker exec mongodb \
              mongosh --quiet \
              --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; then

              echo "MongoDB is ready"
              exit 0
            fi

            echo "Waiting for MongoDB... ($i/30)"
            sleep 1
          done

          echo "MongoDB failed to start"
          docker logs mongodb
          exit 1

      # ==========================================
      # START BACKEND
      # ==========================================

      - name: Start backend
        shell: bash
        run: |
          echo "Starting backend..."

          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Verify backend
        shell: bash
        run: |
          echo "Waiting for backend..."

          for i in $(seq 1 30); do
            if curl -sSf \
              http://localhost:8080/api/tasks/ping \
              > /tmp/backend-health 2>/dev/null; then

              echo "Backend is healthy!"
              cat /tmp/backend-health
              exit 0
            fi

            echo "Waiting for backend... ($i/30)"
            sleep 1
          done

          echo "Backend failed."

          echo "========== BACKEND LOG =========="
          cat server.log

          echo "========== PORT 8080 =========="
          ss -ltnp | grep :8080 || true

          exit 1


  # ==========================================
  # FRONTEND
  # ==========================================

  frontend:
    name: Frontend CI
    needs: backend
    runs-on: self-hosted

    defaults:
      run:
        working-directory: client

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # ==========================================
      # START FRONTEND
      # ==========================================

      - name: Start frontend
        shell: bash
        run: |
          echo "Starting frontend..."

          nohup npm start > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Verify frontend
        shell: bash
        run: |
          echo "Waiting for frontend on port 3000..."

          for i in $(seq 1 30); do
            if curl -sSf \
              http://localhost:3000 \
              > /dev/null 2>&1; then

              echo "Frontend is healthy!"
              exit 0
            fi

            echo "Waiting for frontend... ($i/30)"
            sleep 1
          done

          echo "Frontend failed."

          echo "========== FRONTEND LOG =========="
          cat frontend.log

          exit 1

      # ==========================================
      # TEST FRONTEND → BACKEND
      # ==========================================

      - name: Verify frontend can reach backend
        run: |
          curl -fsS http://localhost:8080/api/tasks/ping

          echo
          echo "Frontend/Backend environment is working!"

