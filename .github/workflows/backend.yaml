name: Backend CI 

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:   # optional (manual trigger)

jobs:
  build:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check db.js
          node --check routes/tasks.js
          node --check models/task.js

      - name: Start app and verify startup
        run: |
          timeout 10 npm start &
          sleep 3
          # Check if app is listening (adjust port as needed)
          curl -f http://localhost:8080/api/tasks/ping || exit 1
