name: Frontend CI

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed

jobs:
  frontend:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build