
name: Todo App CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  combined:
    name: Backend + Frontend CI
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: server
        run: |
          node --check index.js
          node --check db.js
          node --check routes/tasks.js
          node --check models/task.js

      - name: Start MongoDB
        run: |
          docker rm -f mongodb 2>/dev/null || true

          docker run -d \
            --name mongodb \
            -p 27017:27017 \
            marwaahmed11/mongodb:v1

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB..."

          for i in $(seq 1 30); do
            if docker exec mongodb \
              mongosh --quiet \
              --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; then

              echo "MongoDB is ready"
              exit 0
            fi

            echo "Waiting for MongoDB... ($i/30)"
            sleep 1
          done

          echo "MongoDB failed to start"
          docker logs mongodb
          exit 1

      - name: Start backend
        shell: bash
        working-directory: server
        env:
          PORT: 8080
          MONGODB_URI: mongodb://127.0.0.1:27017/todo-app
        run: |
          echo "Starting backend..."
          # start the backend and write logs/pid to the repository root so other steps can access them
          PORT=$PORT MONGODB_URI="$MONGODB_URI" nohup npm start > ../server.log 2>&1 &
          echo $! > ../server.pid
          sleep 2
          tail -n 200 ../server.log || true

      - name: Start frontend
        shell: bash
        working-directory: client
        run: |
          echo "Starting frontend..."
          npm ci
          npm start > ../frontend.log 2>&1 &
          echo $! > ../frontend.pid
          sleep 5
          tail -n 50 ../frontend.log || true

      - name: Verify frontend
        shell: bash
        working-directory: client
        run: |
          echo "Waiting for frontend on port 3000..."

          for i in $(seq 1 60); do
            if curl -sSf \
              http://localhost:3000 \
              > /dev/null 2>&1; then

              echo "Frontend is healthy!"
              exit 0
            fi

            echo "Waiting for frontend... ($i/60)"
            sleep 1
          done

          echo "Frontend failed."

          echo "========== FRONTEND LOG =========="
          cat ../frontend.log || true

          exit 1

      - name: Verify backend API
        shell: bash
        run: |
          echo "Testing backend health..."

          curl -fsS http://localhost:8080/api/tasks/ping

          echo
          echo "Backend API is working!"

      - name: Test adding a task via API
        shell: bash
        run: |
          echo "Testing POST /api/tasks..."

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/tasks \
            -H "Content-Type: application/json" \
            -d '{"task":"Test task from CI","completed":false}')

          echo "Response: $RESPONSE"

          if echo "$RESPONSE" | grep -q "Test task from CI"; then
            echo "Task successfully added!"
          else
            echo "Failed to add task"
            exit 1
          fi

          echo
          echo "Fetching all tasks..."

          TASKS=$(curl -fsS http://localhost:8080/api/tasks)

          echo "Tasks: $TASKS"

          if echo "$TASKS" | grep -q "Test task from CI"; then
            echo "Task successfully retrieved!"
          else
            echo "Task was not found!"
            exit 1
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          echo "Cleaning up..."

          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
            rm -f server.pid
          fi

          if [ -f frontend.pid ]; then
            kill "$(cat frontend.pid)" 2>/dev/null || true
            rm -f frontend.pid
          fi

          docker rm -f mongodb 2>/dev/null || true


