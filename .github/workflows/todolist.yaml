name: Todo App CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  combined:
    name: Backend + Frontend CI
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: server
        run: |
          node --check index.js
          node --check db.js
          node --check routes/tasks.js
          node --check models/task.js

      - name: Start MongoDB
        run: |
          docker rm -f mongodb 2>/dev/null || true

          docker run -d \
            --name mongodb \
            -p 27017:27017 \
            marwaahmed11/mongodb:v1

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB..."

          for i in $(seq 1 30); do
            if docker exec mongodb \
              mongosh --quiet \
              --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; then

              echo "MongoDB is ready"
              exit 0
            fi

            echo "Waiting for MongoDB... ($i/30)"
            sleep 1
          done

          echo "MongoDB failed to start"
          docker logs mongodb
          exit 1

      - name: Start backend
        shell: bash
        working-directory: server
        env:
          PORT: 8080
          MONGODB_URI: mongodb://127.0.0.1:27017/todo-app
        run: |
          echo "Starting backend..."
          # start the backend and write logs/pid to the repository root so other steps can access them
          PORT=$PORT MONGODB_URI="$MONGODB_URI" nohup npm start > ../server.log 2>&1 &
          echo $! > ../server.pid
          sleep 2
          tail -n 200 ../server.log || true

      - name: Verify backend
        shell: bash
        working-directory: server
        run: |
          echo "Waiting for backend..."

          for i in $(seq 1 60); do
            if curl -sSf \
              http://localhost:8080/api/tasks/ping \
              > /tmp/backend-health 2>/dev/null; then

              echo "Backend is healthy!"
              cat /tmp/backend-health
              exit 0
            fi

            echo "Waiting for backend... ($i/60)"
            sleep 1
          done

          echo "Backend failed."

          echo "========== BACKEND LOG =========="
          cat ../server.log || true

          echo "========== PORT 8080 =========="
          ss -ltnp | grep :8080 || true

          exit 1

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Start frontend
        shell: bash
        working-directory: client
        run: |
          echo "Starting frontend..."
          nohup npm start > ../frontend.log 2>&1 &
          echo $! > ../frontend.pid
          sleep 2
          tail -n 200 ../frontend.log || true

      - name: Verify frontend
        shell: bash
        working-directory: client
        run: |
          echo "Waiting for frontend on port 3000..."

          for i in $(seq 1 60); do
            if curl -sSf \
              http://localhost:3000 \
              > /dev/null 2>&1; then

              echo "Frontend is healthy!"
              exit 0
            fi

            echo "Waiting for frontend... ($i/60)"
            sleep 1
          done

          echo "Frontend failed."

          echo "========== FRONTEND LOG =========="
          cat ../frontend.log || true

          exit 1

      - name: Verify frontend can reach backend
        shell: bash
        run: |
          curl -fsS http://localhost:8080/api/tasks/ping

          echo
          echo "Frontend/Backend environment is working!"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          # stop processes if pid files exist
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
            rm -f server.pid
          fi
          if [ -f frontend.pid ]; then
            kill $(cat frontend.pid) 2>/dev/null || true
            rm -f frontend.pid
          fi
          docker rm -f mongodb 2>/dev/null || true

      - name: Test adding a task via API
        shell: bash
        run: |
          echo "Testing POST /api/tasks..."
          
          # Add a task
          RESPONSE=$(curl -X POST http://localhost:8080/api/tasks \
            -H "Content-Type: application/json" \
            -d '{"task":"Test task from CI","completed":false}' \
            -s)
          
          echo "Response: $RESPONSE"
          
          # Verify the task was added by getting all tasks
          echo "Fetching all tasks..."
          TASKS=$(curl -s http://localhost:8080/api/tasks)
          echo "Tasks: $TASKS"
          
          # Check if response contains the task
          if echo "$RESPONSE" | grep -q "Test task from CI"; then
            echo "✅ Task successfully added!"
          else
            echo "❌ Failed to add task"
            exit 1
          fi