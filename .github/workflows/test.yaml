
name: Todo App CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  combined:
    name: Backend + Frontend CI
    runs-on: self-hosted

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18


      # ==========================================
      # BACKEND
      # ==========================================

      - name: Install backend dependencies
        working-directory: server
        run: npm ci


      - name: Check JavaScript syntax
        working-directory: server
        run: |
          node --check index.js
          node --check db.js
          node --check routes/tasks.js
          node --check models/task.js


      # ==========================================
      # MONGODB
      # ==========================================

      - name: Start MongoDB
        run: |
          echo "Cleaning old MongoDB container..."

          docker rm -f mongodb 2>/dev/null || true

          echo "Starting MongoDB..."

          docker run -d \
            --name mongodb \
            -p 27017:27017 \
            marwaahmed11/mongodb:v1

          docker ps --filter name=mongodb


      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB..."

          for i in $(seq 1 30); do

            if docker exec mongodb \
              mongosh --quiet \
              --eval "db.adminCommand('ping').ok" \
              2>/dev/null | grep -q 1; then

              echo "MongoDB is ready!"
              exit 0
            fi

            echo "Waiting for MongoDB... ($i/30)"
            sleep 1
          done

          echo "MongoDB failed to start."

          echo "========== DOCKER STATUS =========="
          docker ps -a

          echo "========== MONGODB LOG =========="
          docker logs mongodb

          exit 1


      # ==========================================
      # BACKEND SERVER
      # ==========================================

      - name: Start backend
        shell: bash
        working-directory: server
        env:
          PORT: 8080
          MONGODB_URI: mongodb://127.0.0.1:27017/todo-app
        run: |

          echo "Cleaning port 8080..."

          fuser -k 8080/tcp 2>/dev/null || true

          echo "Starting backend..."

          PORT=$PORT \
          MONGODB_URI="$MONGODB_URI" \
          nohup npm start > ../server.log 2>&1 &

          SERVER_PID=$!

          echo "$SERVER_PID" > ../server.pid

          sleep 3

          echo "========== BACKEND LOG =========="
          cat ../server.log || true


      - name: Verify backend
        shell: bash
        run: |

          echo "Waiting for backend on port 8080..."

          for i in $(seq 1 60); do

            if curl -fsS \
              http://localhost:8080/api/tasks/ping \
              > /tmp/backend-health 2>/dev/null; then

              echo
              echo "Backend is healthy!"

              cat /tmp/backend-health

              exit 0
            fi

            echo "Waiting for backend... ($i/60)"

            sleep 1
          done

          echo
          echo "Backend failed to start."

          echo "========== BACKEND LOG =========="
          cat server.log || true

          echo "========== PORT 8080 =========="
          ss -ltnp | grep :8080 || true

          exit 1


      # ==========================================
      # FRONTEND
      # ==========================================

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci


      - name: Build frontend
        working-directory: client
        run: npm run build


      - name: Start frontend
        shell: bash
        working-directory: client
        run: |

          echo "Cleaning port 3000..."

          fuser -k 3000/tcp 2>/dev/null || true

          echo "Starting frontend..."

          HOST=0.0.0.0 \
          PORT=3000 \
          BROWSER=none \
          nohup npm start > ../frontend.log 2>&1 &

          FRONTEND_PID=$!

          echo "$FRONTEND_PID" > ../frontend.pid

          sleep 5

          echo "========== FRONTEND LOG =========="

          cat ../frontend.log || true


      - name: Verify frontend
        shell: bash
        run: |

          echo "Waiting for frontend on port 3000..."

          for i in $(seq 1 60); do

            if curl -fsS \
              http://localhost:3000 \
              > /dev/null 2>&1; then

              echo "Frontend is healthy!"

              exit 0
            fi

            echo "Waiting for frontend... ($i/60)"

            sleep 1
          done

          echo
          echo "Frontend failed to start."

          echo "========== FRONTEND LOG =========="

          cat frontend.log || true

          echo "========== PORT 3000 =========="

          ss -ltnp | grep :3000 || true

          exit 1


      # ==========================================
      # BACKEND API TEST
      # ==========================================

      - name: Test backend health
        shell: bash
        run: |

          echo "Testing backend health endpoint..."

          curl -fsS \
            http://localhost:8080/api/tasks/ping

          echo
          echo "Backend health test passed!"


      - name: Test POST /api/tasks
        shell: bash
        run: |

          echo "Testing POST /api/tasks..."

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/tasks \
            -H "Content-Type: application/json" \
            -d '{"task":"Test task from CI","completed":false}')

          echo "Response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q "Test task from CI"; then

            echo "Task successfully added!"

          else

            echo "Failed to add task."

            exit 1

          fi


      - name: Test GET /api/tasks
        shell: bash
        run: |

          echo "Fetching all tasks..."

          TASKS=$(curl -fsS \
            http://localhost:8080/api/tasks)

          echo "Tasks:"
          echo "$TASKS"

          if echo "$TASKS" | grep -q "Test task from CI"; then

            echo "Task successfully retrieved!"

          else

            echo "Task was not found!"

            exit 1

          fi


      # ==========================================
      # KEEP APPLICATION RUNNING
      # ==========================================

      - name: Keep application running for browser testing
        shell: bash
        run: |

          echo
          echo "=========================================="
          echo "Todo application is running!"
          echo "=========================================="
          echo
          echo "Frontend:"
          echo "http://localhost:3000"
          echo
          echo "Backend:"
          echo "http://localhost:8080"
          echo
          echo "Backend health:"
          echo "http://localhost:8080/api/tasks/ping"
          echo
          echo "=========================================="
          echo "You can now test the application"
          echo "from your browser."
          echo "=========================================="
          echo
          echo "Press Ctrl+C or cancel the workflow"
          echo "when you are finished testing."
          echo

          while true; do
            sleep 60
          done
